# Copia este archivo como config.yaml y edítalo.

# Segundos entre comprobaciones de cada producto (mínimo 30, para no saturar la tienda).
interval_seconds: 60

# Abrir automáticamente el navegador en el producto cuando haya stock.
open_browser: true

# Pitido en la terminal cuando haya stock.
beep: true

notifications:
  discord_webhook_url: ""        # https://discord.com/api/webhooks/...
  telegram_bot_token: ""         # token de @BotFather
  telegram_chat_id: ""           # tu chat id

# Tallas US de hombre tal como aparecen en la web de Cactus Jack (3.5 ... 18).
# Pon las tuyas, o deja la lista vacía [] para avisar con cualquier talla.
products:
  - name: "AF1 '07 RS x GTA VI — Black"
    type: shopify
    url: "https://shop.travisscott.com/products/air-force-1-07-rs-black-placeholder"
    sizes: ["9", "9.5"]

  - name: "AF1 '07 RS x GTA VI — Gradient Camo"
    type: shopify
    url: "https://shop.travisscott.com/products/air-force-1-07-rs-gradient-camo-placeholder"
    sizes: ["9", "9.5"]

  - name: "AF1 '07 RS x GTA VI — White"
    type: shopify
    url: "https://shop.travisscott.com/products/air-force-1-07-rs-white-copy"
    sizes: ["9", "9.5"]

